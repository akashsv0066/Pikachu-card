<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
  <div class="main-container">
    <div class="part1">
      <img id="logo-img"
        src="./poke-logo.jpg"
        alt="logo image of pokemon">
      <i class="ri-menu-fill"></i>
      <div class="text-div">
        <p class="normal-head">POKEMON GEN I</p>
        <h1 class="poke-name">Pichachu</h1>
        <p class="info-text">Pikachu is an Electric-type Pokémon introduced in Generation I. Pikachu are small, chubby, and incredibly cute mouse-like Pokémon. They are almost completely covered by yellow fur.</p>
        <div class="date">
          <div class="dash-line">

          </div>
          <p class="date-value">01 / 08</p>
        </div>
        <img class="pokeball" src="./pokeball.png" alt="">
      </div>
    </div>
    
    <img class="Pichachu-img" src="./pikachu.jpg" alt="image of pikachu">
    <div class="scroll-elements">
      <div class="circle black"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
    </div>
  </div>
  

</body>

</html>
