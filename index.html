<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pikachu card</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="card">

        <!-- yellow section -->
        <div class="Left">

            <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg"
                class="logo" >
        
            <div class="text-content">
                <h5>POKEMON Gen</h5>

                <h1>Pikachu</h1>

                <p>
                    Pikachu is an Electric-type Pokémon introduced in Generation 1.
                    Pikachu are small, chubby and incredibly cute.
                </p>

                <button>View More</button>
            </div>
            <div class="circle"></div>
        </div>

        <div class="Right"></div>
        <img src="./pikachu.jpg" class="pikachu" />
    


    <!-- Menu Icon -->
    <div class="menu">
    <i class="ri-menu-line"></i>
    </div>

    <!-- Dots -->
    <div class="dots">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

</body>

</html>
